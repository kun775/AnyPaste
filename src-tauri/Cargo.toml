[package]
name = "anypaste"
version = "0.1.0"
description = "本地剪贴板历史"
edition = "2021"
rust-version = "1.90"

[lib]
name = "anypaste_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-log = "2.10"
log = "0.4"
serde = { version = "1", features = ["derive"] }
dirs = "6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
