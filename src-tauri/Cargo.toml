[package]
name = "anypaste"
version = "0.2.0"
description = "本地剪贴板历史"
edition = "2021"
rust-version = "1.90"

[lib]
name = "anypaste_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-log = "2.10"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-notification = "2.3"
tauri-plugin-autostart = "2.5"
serde_json = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
dirs = "6"
anyhow = "1"
base64 = "0.22"
rusqlite = { version = "0.40", features = ["bundled"] }
blake3 = "1.8"
uuid = { version = "1.28", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg", "gif", "webp"] }
opendal = { version = "0.57", default-features = false, features = [
  "services-webdav",
  "services-s3",
  "services-memory",
  "reqwest-rustls-tls",
] }
aes-gcm = "0.10"
argon2 = "0.5"
tokio = { version = "1", features = ["sync", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = { version = "5.4", features = ["monitor", "std"] }
winreg = "0.56"
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
