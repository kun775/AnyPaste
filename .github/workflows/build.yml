name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      - run: npm run check

      # Rust 编译时会嵌入 dist，需先构建前端
      - run: npm run build
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri

      - run: npm run tauri build -- --bundles nsis

      # 便携版：程序旁的 portable 文件让数据保存在程序目录的 data 子目录中
      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item src-tauri/target/release/anypaste.exe portable/AnyPaste.exe
          New-Item -ItemType File portable/portable | Out-Null
          Compress-Archive -Path portable/* -DestinationPath AnyPaste-portable-x64.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: anypaste-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            AnyPaste-portable-x64.zip
