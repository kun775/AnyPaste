name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      - run: npm run check

      # Rust 编译时会嵌入 dist，需先构建前端
      - run: npm run build
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

      - run: npm run tauri build -- --bundles nsis

      # 便携版：程序旁的 portable 文件让数据保存在程序目录的 data 子目录中
      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item src-tauri/target/release/anypaste.exe portable/AnyPaste.exe
          New-Item -ItemType File portable/portable | Out-Null
          Compress-Archive -Path portable/* -DestinationPath AnyPaste-portable-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: anypaste-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            AnyPaste-portable-x64.zip
